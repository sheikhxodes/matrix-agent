name: Python Application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio ruff
    
    - name: Lint with Ruff
      run: |
        ruff check --output-format=github .
      continue-on-error: true
    
    - name: Type check structure
      run: |
        python -c "from agents.coordinator import coordinator_agent; print('✓ Coordinator imports successfully')"
        python -c "from main import MatrixAgent; print('✓ MatrixAgent imports successfully')"
    
    - name: Run tests
      run: |
        pytest tests/ -v --tb=short || echo "No tests found yet"
